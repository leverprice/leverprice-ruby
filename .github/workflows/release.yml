name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      id-token: write
      contents: read
    env:
      BUNDLE_WITHOUT: lint
      # RubyGems.org account that owns the gem (immutable id), asserted during the OIDC exchange.
      RUBYGEMS_OWNER: "256259"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true
      - name: Check that the tag matches the gem version
        run: test "v$(ruby -Ilib -e 'require "leverprice/version"; print Leverprice::VERSION')" = "$GITHUB_REF_NAME"
      - run: bundle exec rake test
      - run: gem build leverprice.gemspec
      - name: Exchange the GitHub OIDC token for a short-lived RubyGems key
        run: |
          jwt=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)
          key=$(jq -n --arg jwt "$jwt" --arg owner "$RUBYGEMS_OWNER" '{jwt: $jwt, owner: $owner}' \
            | curl -sSf -X POST https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token \
                -H "Content-Type: application/json" --data @- | jq -r .rubygems_api_key)
          echo "::add-mask::$key"
          echo "GEM_HOST_API_KEY=$key" >> "$GITHUB_ENV"
      - run: gem push "leverprice-${GITHUB_REF_NAME#v}.gem"
